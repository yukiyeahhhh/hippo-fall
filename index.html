<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>どうぶつポトン — タイトル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg1:#fef3e2;--bg2:#fde4cf;--board:#e9c9a8;--cell:#f6e4cd;
    --ink:#6b4a32;--ink-soft:#9c7a5c;--accent:#e8915b;--accent-d:#d2763f;
    --fire:#ef6f4d;--danger:#e0364a;--gold:#ffc400;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',system-ui,sans-serif;
    background:radial-gradient(120% 120% at 50% 0%,var(--bg1) 0%,var(--bg2) 100%);
    color:var(--ink);height:100dvh;overflow:hidden;user-select:none;
    display:flex;align-items:center;justify-content:center;position:relative;
  }

  /* 背景：ゆっくり落ちてくる動物たち */
  .bg-fall{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
  .bg-fall span{
    position:absolute;top:-60px;font-size:34px;opacity:.22;
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{transform:translateY(-60px) rotate(0deg);}
    100%{transform:translateY(105dvh) rotate(360deg);}
  }

  /* メインカード */
  .title-wrap{
    position:relative;z-index:1;width:100%;max-width:420px;padding:0 22px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    animation:cardIn .7s cubic-bezier(.2,.9,.3,1.2) both;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.96);}to{opacity:1;transform:none;}}

  /* ロゴ */
  .logo-badge{
    font-size:13px;font-weight:800;letter-spacing:2px;color:var(--accent-d);
    background:rgba(255,255,255,.6);padding:5px 16px;border-radius:999px;
    margin-bottom:14px;box-shadow:0 3px 0 rgba(210,118,63,.18);
  }
  /* ロゴ（SVG仕立て）＋マスコット＋起動演出 */
  .title-logo-d{width:100%;max-width:182px;height:auto;display:block;margin:0 auto;animation:settleIn .5s ease .2s both;}
  .title-logo-p{width:100%;max-width:290px;height:auto;display:block;margin:-6px auto 0;transform-origin:center bottom;animation:potonDrop 1s cubic-bezier(.3,.7,.4,1) .55s both;}
  .title-mascot{width:100%;max-width:268px;height:auto;display:block;margin:8px auto 0;filter:drop-shadow(0 7px 9px rgba(150,90,40,.24));animation:popIn .6s cubic-bezier(.2,.9,.3,1.4) 1.35s both;}
  @keyframes settleIn{0%{opacity:0;transform:translateY(-12px) scale(.96);}100%{opacity:1;transform:none;}}
  @keyframes potonDrop{
    0%{opacity:0;transform:translateY(-260px) scaleY(1.1);}
    10%{opacity:1;}
    50%{transform:translateY(0) scaleY(.84);}
    64%{transform:translateY(-30px) scaleY(1.04);}
    78%{transform:translateY(0) scaleY(.93);}
    89%{transform:translateY(-9px) scaleY(1);}
    100%{transform:translateY(0) scaleY(1);}
  }
  @keyframes popIn{0%{opacity:0;transform:translateY(14px) scale(.7);}60%{opacity:1;transform:translateY(0) scale(1.06);}100%{opacity:1;transform:scale(1);}}
  @keyframes fadeUp{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:none;}}
  h1{
    font-size:clamp(44px,13vw,62px);font-weight:800;line-height:.95;letter-spacing:1px;
    color:#ff9d4d;
    -webkit-text-stroke:5px #fff;paint-order:stroke fill; /* 白い縁取り（ステッカー風） */
    text-shadow:0 3px 0 var(--accent-d),0 6px 0 #b5652f,0 14px 18px rgba(150,90,40,.32); /* 茶の押し出し＋やわ影 */
    margin-bottom:6px;
  }
  h1 .pop{display:inline-block;animation:bob 2.4s ease-in-out infinite;}
  h1 .pop:nth-child(2){animation-delay:.3s;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
  .tagline{font-size:14px;font-weight:700;color:var(--ink-soft);margin:10px 0 22px;animation:fadeUp .5s ease 1.7s both;}

  /* 進化チェーン演出 */
  .chain{
    display:flex;align-items:center;justify-content:center;gap:4px;
    background:rgba(255,255,255,.55);border-radius:18px;padding:12px 14px;
    margin-bottom:26px;box-shadow:0 6px 0 rgba(210,118,63,.12);
  }
  .chain .animal{font-size:30px;display:inline-block;animation:hop 2s ease-in-out infinite;}
  .chain .animal:nth-child(1){animation-delay:0s;}
  .chain .animal:nth-child(3){animation-delay:.15s;}
  .chain .animal:nth-child(5){animation-delay:.3s;}
  .chain .animal:nth-child(7){animation-delay:.45s;}
  .chain .animal:nth-child(9){animation-delay:.6s;font-size:36px;}
  @keyframes hop{0%,100%{transform:translateY(0) scale(1);}40%{transform:translateY(-8px) scale(1.08);}}
  .chain .arr{color:var(--accent);font-size:14px;font-weight:800;}
  .chain .animal img{width:34px;height:34px;object-fit:contain;display:block;}
  .chain .animal:nth-child(9) img{width:40px;height:40px;}
  .bg-fall img{position:absolute;top:-60px;opacity:.22;object-fit:contain;animation:fall linear infinite;}

  /* ボタン群 */
  .btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px;}
  .btn{
    font-family:inherit;font-weight:800;border:none;cursor:pointer;
    border-radius:18px;padding:17px;font-size:19px;transition:transform .1s,box-shadow .15s;
  }
  .btn-main{
    color:#fff;background:linear-gradient(180deg,#f0a06a,var(--accent-d));
    box-shadow:0 6px 0 #b25d2c,0 10px 18px rgba(180,90,40,.35);
  }
  .btn-main:active{transform:translateY(4px);box-shadow:0 2px 0 #b25d2c,0 4px 10px rgba(180,90,40,.3);}
  .btn-sub{
    color:var(--accent-d);background:rgba(255,255,255,.7);font-size:16px;padding:13px;
    box-shadow:0 4px 0 rgba(210,118,63,.18);
  }
  .btn-sub:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(210,118,63,.18);}

  .footer{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:10px;color:var(--ink-soft);opacity:.6;z-index:1;}

  .toast{
    position:fixed;bottom:60px;left:50%;transform:translateX(-50%) translateY(8px);
    background:rgba(107,74,50,.88);color:#fff;font-size:13px;font-weight:700;
    padding:9px 20px;border-radius:999px;pointer-events:none;
    opacity:0;transition:opacity .2s,transform .2s;z-index:100;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
  <!-- 背景に落ちてくる動物 -->
  <div class="bg-fall" id="bgFall"></div>

  <div class="title-wrap">
    <svg class="title-logo-d" viewBox="0 0 360 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="どうぶつ">
      <defs>
        <linearGradient id="lgB1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffd98a"/><stop offset="100%" stop-color="#ffab4a"/></linearGradient>
        <filter id="lgDs1" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="3" flood-color="#7d4a1f" flood-opacity="0.4"/></filter>
      </defs>
      <g filter="url(#lgDs1)" transform="rotate(-2 180 70)" font-family="'M PLUS Rounded 1c'" font-weight="800" text-anchor="middle" stroke-linejoin="round" font-size="78">
        <text x="180" y="86" fill="none" stroke="#5e3b1e" stroke-width="20">どうぶつ</text>
        <text x="180" y="86" fill="none" stroke="#fff" stroke-width="12">どうぶつ</text>
        <text x="180" y="86" fill="url(#lgB1)">どうぶつ</text>
      </g>
    </svg>
    <svg class="title-logo-p" viewBox="0 0 420 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ポトン">
      <defs>
        <linearGradient id="lgB2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffb24d"/><stop offset="100%" stop-color="#ef6f2e"/></linearGradient>
        <filter id="lgDs2" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="3.5" flood-color="#7d4a1f" flood-opacity="0.42"/></filter>
      </defs>
      <g filter="url(#lgDs2)" transform="rotate(1.5 210 120)" font-family="'M PLUS Rounded 1c'" font-weight="800" text-anchor="middle" stroke-linejoin="round" font-size="122">
        <text x="210" y="132" fill="none" stroke="#5e3b1e" stroke-width="28">ポトン</text>
        <text x="210" y="132" fill="none" stroke="#fff" stroke-width="16">ポトン</text>
        <text x="210" y="132" fill="url(#lgB2)">ポトン</text>
      </g>
    </svg>
    <img class="title-mascot" src="assets/logo_mascot.webp" alt="どうぶつポトンの仲間たち">
    <div class="tagline">つなげて育てて、コビトカバを呼ぼう！</div>

    <div class="btns">
      <button class="btn btn-main" onclick="onStart()">▶ はじめる</button>
      <button class="btn btn-sub" onclick="onHelp()">📖 あそびかた</button>
      <button class="btn btn-sub" onclick="onShare()">🔗 シェアする</button>
      <button class="btn btn-sub" onclick="window.open('https://forms.gle/Q12ew2W9Xh6ttDBz6','_blank')">💬 感想・バグ報告</button>
    </div>

  </div>

  <div class="toast" id="toast">URLをコピーしました</div>

  <audio id="titleBgm" src="assets/bgm/dew.mp3" loop preload="auto"></audio>

  <button id="musicBtn" onclick="toggleTitleBgm()" style="position:fixed;bottom:32px;right:12px;background:rgba(255,255,255,.6);border:none;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;z-index:10;">🔇</button>

  <div class="footer">© どうぶつポトン</div>

<script>
  const animals=['tile_t1','tile_t2','tile_t3','tile_t4','tile_t5','gimmick_block'];
  const bg=document.getElementById('bgFall');
  for(let i=0;i<14;i++){
    const s=document.createElement('img');
    s.src='assets/'+animals[Math.floor(Math.random()*animals.length)]+'.webp';
    s.alt='';
    s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(7+Math.random()*8)+'s';
    s.style.animationDelay=(-Math.random()*12)+'s';
    const sz=(28+Math.random()*26)|0;
    s.style.width=sz+'px';s.style.height=sz+'px';
    bg.appendChild(s);
  }

  const titleBgm=document.getElementById('titleBgm');
  const musicBtn=document.getElementById('musicBtn');
  let bgmOff=false;
  try{const v=JSON.parse(localStorage.getItem('animalDrop_bgm_v1')||'{}');titleBgm.volume=v.vol??0.5;bgmOff=(v.sel==='off');}catch(e){}

  function updateMusicBtn(){musicBtn.textContent=titleBgm.paused?'🔇':'🎵';}

  function playTitleBgm(){
    if(bgmOff)return;
    titleBgm.play().then(updateMusicBtn).catch(()=>{});
  }

  function toggleTitleBgm(){
    if(titleBgm.paused){bgmOff=false;playTitleBgm();}
    else{titleBgm.pause();bgmOff=true;updateMusicBtn();}
  }

  // 初回タップで自動再生を試みる
  function onFirstInteraction(){
    playTitleBgm();
    document.removeEventListener('touchstart',onFirstInteraction);
    document.removeEventListener('click',onFirstInteraction);
  }
  document.addEventListener('touchstart',onFirstInteraction);
  document.addEventListener('click',onFirstInteraction);

  function onStart(){ location.href='game.html'; }
  function onHelp(){ location.href='game.html?help=1'; }

  function onShare(){
    const url=location.href;
    const data={title:'どうぶつポトン',text:'つなげて育てて、コビトカバを呼ぼう！',url};
    if(navigator.share && navigator.canShare && navigator.canShare(data)){
      navigator.share(data).catch(()=>{});
    } else {
      navigator.clipboard.writeText(url).then(()=>{
        const t=document.getElementById('toast');
        t.classList.add('show');
        clearTimeout(t._tid);
        t._tid=setTimeout(()=>t.classList.remove('show'),2000);
      }).catch(()=>{});
    }
  }
</script>
</body>
</html>
